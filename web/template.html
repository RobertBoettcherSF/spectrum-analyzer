<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ada Spectrum Analyzer</title>
<style>
  :root {
    --bg: #111;
    --panel: #050805;
    --yellow: #ffd400;
    --axis: #8c8;
    --info: #8a8;
    --head: #9c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: #ddd; }
  body {
    font-family: "DejaVu Sans Mono", ui-monospace, "Cascadia Mono", "Liberation Mono", monospace;
    padding: 16px 12px 28px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--yellow);
    margin: 0 0 6px;
  }
  .info {
    font-size: 12px;
    line-height: 1.45;
    color: var(--info);
    white-space: pre-wrap;
    margin: 0 0 12px;
  }
  #err {
    color: #f88;
    background: #2a1010;
    border: 1px solid #633;
    padding: 8px 10px;
    margin: 0 0 12px;
    white-space: pre-wrap;
  }
  .scr {
    background: var(--panel);
    border: 3px solid #333;
    border-radius: 8px;
    box-shadow: 0 0 0 6px #222, inset 0 0 30px #000;
    padding: 10px 10px 8px;
    margin: 0 8px 22px;
  }
  h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--head);
    margin: 2px 2px 6px;
    letter-spacing: 0.03em;
  }
  canvas { display: block; width: 100%; background: var(--panel); touch-action: pan-y; }
  #sp { height: 420px; }
  #wf { height: 280px; }
  #tl { height: 200px; }
  pre {
    font: 13px/1.45 "DejaVu Sans Mono", ui-monospace, monospace;
    color: var(--yellow);
    margin: 8px 4px 2px;
    white-space: pre;
    overflow-x: auto;
  }
  #cur { color: #6d6; margin: 4px 4px 0; }
  #cur:empty { display: none; }
  #edges { color: var(--yellow); }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
    margin: 0 8px 8px;
  }
  .drop {
    position: relative;
    flex: 1 1 280px;
    border: 1px dashed #4a6;
    background: #0c140c;
    color: #9c9;
    padding: 10px 12px;
    min-height: 44px;
    display: flex;
    align-items: center;
  }
  .drop.hot { border-color: var(--yellow); color: var(--yellow); }
  .drop input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
  }
  button, .hz input {
    font: inherit;
    background: #141c14;
    color: var(--yellow);
    border: 1px solid #4a6;
    padding: 8px 12px;
  }
  button { cursor: pointer; }
  button:disabled { color: #575; border-color: #343; cursor: default; }
  .hz {
    color: #8c8;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    justify-content: center;
  }
  .hz input { width: 7.2em; }
  .meta {
    color: #9c9;
    font-size: 12px;
    margin: 0 8px 12px;
    min-height: 1.2em;
  }
  .meta:empty { display: none; }
  .foot {
    color: #566;
    font-size: 11px;
    margin: 4px 8px 0;
    line-height: 1.4;
  }
  @media (max-width: 700px) {
    body { padding: 10px 6px 20px; }
    h1 { font-size: 16px; }
    .scr { margin: 0 4px 16px; box-shadow: 0 0 0 4px #222, inset 0 0 20px #000; }
    .bar, .meta { margin-left: 4px; margin-right: 4px; }
    #sp { height: 300px; }
    #wf { height: 200px; }
    #tl { height: 168px; }
    pre { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ADA SPECTRUM ANALYZER</h1>
  <div class="info" id="info">Loading the Ada WebAssembly module…</div>
  <div id="err" hidden></div>
  <div class="bar">
    <div class="drop" id="drop">
      <span>Drop a 16-bit PCM .wav here, or click to choose. Paste a file too.</span>
      <input id="file" type="file" accept=".wav,audio/wav,audio/x-wav,audio/wave"
             aria-label="Choose a 16-bit PCM WAV file">
    </div>
    <label class="hz">CARRIER Hz
      <input id="carrier" type="number" value="216.67" min="0.01" step="0.01"
             aria-label="Carrier frequency in hertz">
    </label>
    <button type="button" id="run" disabled>Run analysis</button>
    <button type="button" id="demo">Demo</button>
  </div>
  <div class="meta" id="meta"></div>

  <div class="scr">
    <h2>SPECTRUM (dBFS)</h2>
    <canvas id="sp"></canvas>
    <pre id="cur"></pre>
    <pre id="ro">MARKERS:</pre>
  </div>

  <div class="scr">
    <h2>WATERFALL (STFT)</h2>
    <canvas id="wf"></canvas>
  </div>

  <div class="scr">
    <h2 id="tlh">CARRIER ON/OFF TIMELINE</h2>
    <canvas id="tl"></canvas>
    <pre id="edges"></pre>
  </div>

  <p class="foot" id="foot"></p>
</div>
<script>
"use strict";
__WAV_PCM_JS__
const WASM = "__WASM_BASE64__";

const sp = document.getElementById("sp");
const wf = document.getElementById("wf");
const tl = document.getElementById("tl");
const info = document.getElementById("info");
const err = document.getElementById("err");
const ro = document.getElementById("ro");
const cur = document.getElementById("cur");
const edgesEl = document.getElementById("edges");
const tlh = document.getElementById("tlh");
const foot = document.getElementById("foot");

function dbText(db10) { return (db10 / 10).toFixed(1); }
function hzText(uhz) { return (uhz / 1e6).toFixed(2); }
function sText(us) { return (us / 1e6).toFixed(2); }

function fail(msg) {
  err.hidden = false;
  err.textContent = String(msg);
  info.textContent = "The analyzer did not finish.";
}

function decodeB64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function prep(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cssW = cv.clientWidth || 320;
  const cssH = cv.clientHeight || 160;
  cv.width = Math.max(1, Math.round(cssW * dpr));
  cv.height = Math.max(1, Math.round(cssH * dpr));
  return { c: cv.getContext("2d"), w: cv.width, h: cv.height, dpr };
}

function grid(c, x0, y0, w, h, nx, ny) {
  c.strokeStyle = "#1f3a1f";
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 0; i <= nx; i++) {
    const x = x0 + (w * i) / nx;
    c.moveTo(x, y0);
    c.lineTo(x, y0 + h);
  }
  for (let j = 0; j <= ny; j++) {
    const y = y0 + (h * j) / ny;
    c.moveTo(x0, y);
    c.lineTo(x0 + w, y);
  }
  c.stroke();
  c.strokeStyle = "#4a6";
  c.strokeRect(x0, y0, w, h);
}

function mono(c, dpr, px) {
  c.font = Math.max(9, Math.round(px * dpr)) + "px monospace";
}

let data = null;
let specGeom = null;
let ada = null;
let pending = null;
let shownFile = null;
const runBtn = document.getElementById("run");
const carrierInput = document.getElementById("carrier");
const meta = document.getElementById("meta");
const drop = document.getElementById("drop");

function pull(ada) {
  const nsrc = ada.sa_source_len();
  let source = "";
  for (let i = 1; i <= nsrc; i++) source += String.fromCharCode(ada.sa_source_char(i));
  const bins = ada.sa_spec_bins();
  const spec = new Int32Array(bins);
  for (let k = 0; k < bins; k++) spec[k] = ada.sa_spec_db10(k);
  const markers = [];
  for (let i = 1; i <= ada.sa_markers(); i++) {
    markers.push({
      hz: ada.sa_marker_uhz(i),
      db: ada.sa_marker_db10(i),
      car: ada.sa_marker_carrier(i) === 1
    });
  }
  const rows = ada.sa_wf_rows(), cols = ada.sa_wf_cols();
  const waterfall = new Array(rows);
  for (let r = 0; r < rows; r++) {
    const row = new Uint8Array(cols);
    for (let c = 0; c < cols; c++) row[c] = ada.sa_wf(r, c);
    waterfall[r] = row;
  }
  const ntl = ada.sa_tl_count();
  const timeline = new Array(ntl);
  for (let i = 0; i < ntl; i++) {
    timeline[i] = { t: ada.sa_tl_us(i), db: ada.sa_tl_db10(i), on: ada.sa_tl_on(i) === 1 };
  }
  const edges = [];
  for (let i = 1; i <= ada.sa_edges(); i++) {
    edges.push({ on: ada.sa_edge_on_us(i), off: ada.sa_edge_off_us(i) });
  }
  return {
    source, spec, markers, waterfall, timeline, edges,
    rate: ada.sa_rate(),
    fft: ada.sa_fft_n(),
    stft: ada.sa_stft_n(),
    hop: ada.sa_hop(),
    avg: ada.sa_avg_count(),
    df: ada.sa_df_uhz(),
    sdf: ada.sa_sdf_uhz(),
    fmax: ada.sa_fmax_uhz(),
    carrier: ada.sa_carrier_uhz(),
    bin: ada.sa_carrier_bin(),
    dur: ada.sa_duration_us(),
    floor: ada.sa_floor_db10(),
    thr: ada.sa_thr_db10(),
    lo: ada.sa_lo_db10(),
    hi: ada.sa_hi_db10(),
    rbw: ada.sa_rbw_uhz(),
    tone: ada.sa_tone_peak_ppm(),
    toneOk: ada.sa_tone_ok() === 1
  };
}

function paintInfo() {
  const rbw = (data.rbw / 1e6).toFixed(2);
  const car = hzText(data.carrier);
  const head = shownFile ? "FILE: " + shownFile.name + "\n" : "";
  info.textContent =
    head +
    "SRC: " + data.source + "\n" +
    "FS " + data.rate + " Hz | FFT " + data.fft + " Hann | RBW " + rbw +
    " Hz | AVG " + data.avg + " | STFT " + data.stft + "/hop " + data.hop +
    " | CARRIER " + car + " Hz";
  tlh.textContent = "CARRIER " + car + " Hz ON/OFF TIMELINE";
  let text = "MARKERS:\n";
  data.markers.forEach((m, i) => {
    text += " M" + (i + 1) + "  " + hzText(m.hz).padStart(8) + " Hz  " +
      dbText(m.db).padStart(6) + " dBFS" + (m.car ? "  <- CARRIER" : "") + "\n";
  });
  ro.textContent = text;
  let el = "";
  data.edges.forEach(e => {
    el += "ON " + sText(e.on).padStart(5) + " s .. " + sText(e.off).padStart(5) + " s\n";
  });
  el += data.edges.length + " pulses";
  edgesEl.textContent = el;
  foot.textContent =
    "Computed in Ada (Hann, radix-2 FFT, dBFS, STFT, parabolic peaks, carrier edges), " +
    "compiled with AdaWebPack 24 to WebAssembly. JavaScript only reads the WAV and draws. " +
    "FFT self-test peak " + (data.tone / 1e6).toFixed(6) + ".";
}

function drawSpectrum() {
  const { c, w, h, dpr } = prep(sp);
  const x0 = Math.round(58 * dpr);
  const y0 = Math.round(8 * dpr);
  const plotW = Math.max(10, w - x0 - Math.round(16 * dpr));
  const plotH = Math.max(10, h - y0 - Math.round(32 * dpr));
  const fmax = data.fmax / 1e6;
  const df = data.df / 1e6;
  const top = 0, bot = -140;
  const xOf = f => x0 + plotW * f / fmax;
  const yOf = db => {
    const d = Math.max(bot, Math.min(top, db));
    return y0 + plotH * (top - d) / (top - bot);
  };
  c.fillStyle = "#050805";
  c.fillRect(0, 0, w, h);
  grid(c, x0, y0, plotW, plotH, 10, 14);
  mono(c, dpr, 11);
  c.fillStyle = "#8c8";
  c.textAlign = "center";
  for (let i = 0; i <= 10; i++) {
    c.fillText((fmax * i / 10).toFixed(0), xOf(fmax * i / 10), y0 + plotH + Math.round(14 * dpr));
  }
  c.textAlign = "right";
  for (let j = 0; j <= 14; j++) {
    c.fillText(String(top - j * 10), x0 - Math.round(6 * dpr), y0 + (plotH * j) / 14 + Math.round(4 * dpr));
  }
  c.textAlign = "left";
  c.fillText("Hz", x0 + plotW - Math.round(16 * dpr), y0 + plotH + Math.round(26 * dpr));
  c.fillText("dBFS", Math.round(4 * dpr), y0 + plotH + Math.round(26 * dpr));

  c.save();
  c.beginPath();
  c.rect(x0, y0, plotW, plotH);
  c.clip();
  c.strokeStyle = "#ffd400";
  c.lineWidth = Math.max(1, 1.4 * dpr);
  c.shadowColor = "#ffd400";
  c.shadowBlur = 4 * dpr;
  c.beginPath();
  for (let k = 0; k < data.spec.length; k++) {
    const x = xOf(k * df);
    const y = yOf(data.spec[k] / 10);
    if (k === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.stroke();
  c.restore();

  const cx = xOf(data.carrier / 1e6);
  c.strokeStyle = "#f44";
  c.lineWidth = Math.max(1, dpr);
  c.setLineDash([4 * dpr, 4 * dpr]);
  c.beginPath();
  c.moveTo(cx, y0);
  c.lineTo(cx, y0 + plotH);
  c.stroke();
  c.setLineDash([]);

  c.shadowBlur = 0;
  mono(c, dpr, 11);
  c.textAlign = "center";
  let prevX = -1e9;
  data.markers.forEach((m, i) => {
    const x = xOf(m.hz / 1e6);
    const y = yOf(m.db / 10);
    const lift = Math.abs(x - prevX) < 36 * dpr ? 14 * dpr : 0;
    prevX = x;
    c.fillStyle = "#0ff";
    c.beginPath();
    c.moveTo(x, y - 4 * dpr);
    c.lineTo(x - 5 * dpr, y - 13 * dpr);
    c.lineTo(x + 5 * dpr, y - 13 * dpr);
    c.fill();
    c.fillText("M" + (i + 1), x, Math.max(y0 + 11 * dpr, y - (16 * dpr + lift)));
  });
  specGeom = { x0, y0, plotW, plotH, fmax, df, dpr };
}

function wfColor(v) {
  const t = v / 99;
  const r = Math.min(255, Math.max(0, 510 * (t - 0.5)));
  const g = Math.min(255, Math.max(0, t < 0.5 ? 510 * t : 255));
  const b = Math.max(0, 255 * (0.6 - t) * 1.5);
  return [r | 0, g | 0, b | 0];
}

function drawWaterfall() {
  const { c, w, h, dpr } = prep(wf);
  const x0 = Math.round(58 * dpr);
  const plotW = Math.max(10, w - x0 - Math.round(16 * dpr));
  const plotH = Math.max(10, h - Math.round(22 * dpr));
  c.fillStyle = "#050805";
  c.fillRect(0, 0, w, h);
  const rows = data.waterfall.length;
  const cols = rows ? data.waterfall[0].length : 0;
  if (rows && cols) {
    const img = c.createImageData(plotW, plotH);
    const fmax = data.fmax / 1e6;
    const sdf = data.sdf / 1e6;
    const pix = img.data;
    for (let y = 0; y < plotH; y++) {
      const row = data.waterfall[Math.min(rows - 1, Math.floor(y * rows / plotH))];
      for (let x = 0; x < plotW; x++) {
        const f = (x / plotW) * fmax;
        const k = Math.min(cols - 1, Math.max(0, Math.round(f / sdf)));
        const [r, g, b] = wfColor(row[k]);
        const o = (y * plotW + x) * 4;
        pix[o] = r; pix[o + 1] = g; pix[o + 2] = b; pix[o + 3] = 255;
      }
    }
    c.putImageData(img, x0, 0);
  }
  c.strokeStyle = "#4a6";
  c.strokeRect(x0, 0, plotW, plotH);
  mono(c, dpr, 11);
  c.fillStyle = "#8c8";
  c.textAlign = "center";
  const fmax = data.fmax / 1e6;
  for (let i = 0; i <= 10; i++) {
    c.fillText((fmax * i / 10).toFixed(0), x0 + plotW * i / 10, plotH + Math.round(14 * dpr));
  }
  c.textAlign = "right";
  const dur = data.dur / 1e6;
  for (let j = 0; j <= 5; j++) {
    c.fillText((dur * j / 5).toFixed(1) + "s", x0 - Math.round(6 * dpr), Math.max(10 * dpr, plotH * j / 5 + 4 * dpr));
  }
}

function drawTimeline() {
  const { c, w, h, dpr } = prep(tl);
  const x0 = Math.round(58 * dpr);
  const y0 = Math.round(8 * dpr);
  const plotW = Math.max(10, w - x0 - Math.round(16 * dpr));
  const plotH = Math.max(10, h - y0 - Math.round(28 * dpr));
  const dur = data.dur;
  const pts = data.timeline;
  c.fillStyle = "#050805";
  c.fillRect(0, 0, w, h);
  grid(c, x0, y0, plotW, plotH, 20, 4);
  if (!pts.length || dur <= 0) return;
  let lo = pts[0].db, hi = pts[0].db;
  for (const p of pts) { if (p.db < lo) lo = p.db; if (p.db > hi) hi = p.db; }
  const loDb = lo / 10 - 3;
  const hiDb = hi / 10 + 3;
  const span = hiDb - loDb || 1;
  const xOf = us => x0 + plotW * us / dur;
  const yOf = db => y0 + plotH * (hiDb - db) / span;
  c.fillStyle = "rgba(255,212,0,0.18)";
  for (let i = 0; i < pts.length; i++) {
    if (!pts[i].on) continue;
    const x1 = xOf(pts[i].t);
    const x2 = i + 1 < pts.length ? xOf(pts[i + 1].t) : xOf(dur);
    c.fillRect(x1, y0, Math.max(1, x2 - x1), plotH);
  }
  c.strokeStyle = "#ffd400";
  c.lineWidth = Math.max(1, 1.4 * dpr);
  c.beginPath();
  pts.forEach((p, i) => {
    const x = xOf(p.t), y = yOf(p.db / 10);
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  });
  c.stroke();
  const thr = data.thr / 10;
  const ty = yOf(thr);
  c.strokeStyle = "#f44";
  c.lineWidth = Math.max(1, dpr);
  c.setLineDash([5 * dpr, 4 * dpr]);
  c.beginPath();
  c.moveTo(x0, ty);
  c.lineTo(x0 + plotW, ty);
  c.stroke();
  c.setLineDash([]);
  mono(c, dpr, 11);
  c.fillStyle = "#8c8";
  c.textAlign = "center";
  for (let i = 0; i <= 20; i += 2) {
    c.fillText((dur / 1e6 * i / 20).toFixed(1) + "s", xOf(dur * i / 20), y0 + plotH + Math.round(14 * dpr));
  }
  c.textAlign = "right";
  c.fillText(hiDb.toFixed(0) + " dB", x0 - Math.round(6 * dpr), y0 + Math.round(10 * dpr));
  c.fillText(loDb.toFixed(0) + " dB", x0 - Math.round(6 * dpr), y0 + plotH);
  c.textAlign = "left";
  c.fillText("THR " + thr.toFixed(1), x0 + plotW - Math.round(78 * dpr), Math.max(y0 + 12 * dpr, ty - 4 * dpr));
}

function drawAll() {
  drawSpectrum();
  drawWaterfall();
  drawTimeline();
}

sp.addEventListener("pointermove", e => {
  if (!data || !specGeom) return;
  const r = sp.getBoundingClientRect();
  const x = (e.clientX - r.left) * (sp.width / r.width);
  const g = specGeom;
  if (x < g.x0 || x > g.x0 + g.plotW) { cur.textContent = ""; return; }
  const f = (x - g.x0) / g.plotW * g.fmax;
  const k = Math.max(0, Math.min(data.spec.length - 1, Math.round(f / g.df)));
  cur.textContent = "CURSOR  " + (k * g.df).toFixed(2) + " Hz   " + dbText(data.spec[k]) + " dBFS";
});
sp.addEventListener("pointerleave", () => { cur.textContent = ""; });
addEventListener("resize", () => { if (data) drawAll(); });

function showErr(msg) {
  err.hidden = false;
  err.textContent = String(msg);
}

function clearErr() {
  err.hidden = true;
  err.textContent = "";
}

function limits() {
  return {
    minSamples: ada.sa_pcm_min(),
    maxSamples: ada.sa_pcm_cap(),
    minRate: ada.sa_pcm_min_rate(),
    maxRate: ada.sa_pcm_max_rate()
  };
}

function pcmStatusText(code) {
  switch (code) {
    case 1: return "The sample rate is outside the range this analyzer accepts.";
    case 2: return "This file is too short. It needs at least one full FFT frame.";
    case 3: return "This file is too long for the analyzer.";
    case 4: return "The carrier frequency is outside the range this file can track.";
    default: return "The Ada analyzer rejected the samples (status " + code + ").";
  }
}

async function takeFile(file) {
  if (!file) return;
  if (!ada) {
    showErr("The Ada module is still loading.");
    return;
  }
  let buf;
  try {
    buf = await file.arrayBuffer();
  } catch (e) {
    showErr("Could not read " + (file.name || "that file") + ".\n" + e);
    return;
  }
  const parsed = parseWavPcm(buf, limits());
  if (!parsed.ok) {
    pending = null;
    runBtn.disabled = true;
    meta.textContent = "";
    showErr(parsed.error);
    return;
  }
  pending = {
    name: file.name || "pasted.wav",
    rate: parsed.rate,
    frames: parsed.frames,
    samples: parsed.samples,
    mixed: parsed.mixed
  };
  const secs = (parsed.frames / parsed.rate).toFixed(2);
  const kind = parsed.mixed ? "16-bit stereo, mixed to mono" : "16-bit mono";
  meta.textContent =
    "LOADED " + pending.name + " · " + parsed.rate + " Hz · " +
    secs + " s · " + parsed.frames + " samples · " + kind;
  runBtn.disabled = false;
  clearErr();
}

function writePcm(samples) {
  const ptr = ada.sa_pcm_ptr();
  const cap = ada.sa_pcm_cap();
  if (!ada.memory || ptr <= 0 || (ptr & 1) !== 0) {
    throw new Error("The Ada PCM buffer is not available.");
  }
  if (samples.length > cap) {
    throw new Error("The file is longer than the Ada buffer.");
  }
  new Int16Array(ada.memory.buffer, ptr, samples.length).set(samples);
}

function carrierChoice(rate) {
  const hz = Number(carrierInput.value);
  const capHz = ada.sa_pcm_fmax_uhz() / 1e6;
  if (!Number.isFinite(hz) || hz <= 0 || hz >= capHz) {
    return {
      ok: false,
      error: "Carrier must be greater than 0 and below " + capHz.toFixed(0) + " Hz."
    };
  }
  if (hz >= rate / 2) {
    return {
      ok: false,
      error: "Carrier " + hz + " Hz is at or above half the sample rate (" +
        (rate / 2) + " Hz)."
    };
  }
  return { ok: true, hz };
}

function finishRun(ms) {
  data.ms = ms;
  if (!data.toneOk) {
    showErr("FFT self-test failed. Bin-centred Hann peak was " +
      (data.tone / 1e6).toFixed(6) + " instead of 1.");
  }
  paintInfo();
  drawAll();
}

async function runLoaded() {
  if (!ada || !pending) return;
  const car = carrierChoice(pending.rate);
  if (!car.ok) {
    showErr(car.error);
    return;
  }
  clearErr();
  info.textContent = "Running the radix-2 FFT, STFT and carrier tracker on " +
    pending.name + "…";
  await new Promise(r => setTimeout(r, 30));
  try {
    writePcm(pending.samples);
    const t0 = performance.now();
    const status = ada.sa_analyze_pcm(
      pending.rate, pending.samples.length, Math.round(car.hz * 1e6));
    const ms = performance.now() - t0;
    if (status !== 0) {
      showErr(pcmStatusText(status));
      return;
    }
    data = pull(ada);
    shownFile = pending;
    finishRun(ms);
  } catch (e) {
    fail("The Ada analyzer trapped.\n" + e);
  }
}

async function runDemo() {
  if (!ada) return;
  clearErr();
  shownFile = null;
  info.textContent = "Running the radix-2 FFT, STFT and carrier tracker in Ada…";
  await new Promise(r => setTimeout(r, 30));
  try {
    const t0 = performance.now();
    ada.sa_analyze();
    const ms = performance.now() - t0;
    data = pull(ada);
    finishRun(ms);
  } catch (e) {
    fail("The Ada analyzer trapped.\n" + e);
  }
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (f) takeFile(f);
  e.target.value = "";
});
runBtn.addEventListener("click", () => { runLoaded(); });
document.getElementById("demo").addEventListener("click", () => { runDemo(); });

let dragDepth = 0;
addEventListener("dragenter", e => {
  e.preventDefault();
  dragDepth++;
  drop.classList.add("hot");
});
addEventListener("dragleave", () => {
  dragDepth--;
  if (dragDepth <= 0) {
    dragDepth = 0;
    drop.classList.remove("hot");
  }
});
addEventListener("dragover", e => { e.preventDefault(); });
addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove("hot");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) takeFile(f);
});
addEventListener("paste", e => {
  if (e.target && e.target.id === "carrier") return;
  const cd = e.clipboardData;
  if (!cd) return;
  let file = cd.files && cd.files.length ? cd.files[0] : null;
  if (!file && cd.items) {
    for (const item of cd.items) {
      if (item.kind === "file") {
        file = item.getAsFile();
        if (file) break;
      }
    }
  }
  if (!file) {
    showErr("Paste a .wav file, or use the file picker.");
    return;
  }
  e.preventDefault();
  takeFile(file);
});

async function main() {
  try {
    const compiled = await WebAssembly.instantiate(decodeB64(WASM));
    ada = compiled.instance.exports;
  } catch (e) {
    fail("Could not instantiate the Ada module.\n" + e);
    return;
  }
  if (typeof ada.sa_analyze !== "function" || typeof ada.sa_analyze_pcm !== "function") {
    fail("The module is missing sa_analyze or sa_analyze_pcm.");
    return;
  }
  if (!ada.memory) {
    fail("The module did not export its memory, so a WAV cannot be loaded.");
    return;
  }
  await runDemo();
}
main();
</script>
</body>
</html>
